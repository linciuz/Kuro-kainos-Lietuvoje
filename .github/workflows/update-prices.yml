name: Update prices (frequent)

# Fast-changing PRICE data only (no heavy chain/EV directory fetches — those run
# once a day in update-fuel-prices.yml). Runs HOURLY through the Lithuanian
# morning so we grab LEA's once-a-day file within ~1h of it being published
# (and survive GitHub's flaky scheduler), then a couple of afternoon refreshes.
#
# GitHub cron is UTC-only. Lithuania is UTC+3 (summer) / UTC+2 (winter), so the
# 04:15-10:15 UTC band = ~06:15-13:15 local, covering the 7-12 LT morning in
# both seasons. LEA publishes on working days, so Mon-Fri.
on:
  schedule:
    # PRIMARY scheduling lives in the Cloudflare Worker cron (worker/wrangler.toml),
    # which fires reliably and pokes this via workflow_dispatch every 15 min across
    # 09:00-14:00 LT (LEA's real publish window is ~11:00-noon, not the nominal 10:00).
    # The entries below are only a sparse DEAD-MAN BACKUP in case the Worker/token
    # ever breaks — odd minutes, off GitHub's congested :00/:15/:30/:45 peaks.
    - cron: "47 8,9 * * 1-5"    # 11:47 + 12:47 LT (inside the real LEA window)
    - cron: "47 12 * * 1-5"     # 15:47 LT afternoon safety net
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize with the daily full run so the two never push at the same time.
concurrency:
  group: kk-data-write
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      # LEA daily prices. Non-fatal: if the SharePoint file is briefly down, we
      # keep the last stations.json and still refresh the other sources below.
      - name: Fetch LEA prices
        run: python scripts/fetch_prices.py || echo "LEA fetch failed (non-fatal) — keeping last prices"
      # Ground-truth guard: re-check the LIVE ena.lt listing and, if we're behind
      # the newest published file, re-fetch to self-heal a stale-page race.
      # Non-fatal here — the post-commit gate is what alerts on a real miss.
      - name: Freshness self-heal (re-fetch if behind LEA)
        run: python scripts/verify_freshness.py || echo "freshness self-heal warning (non-fatal)"
      - name: Snapshot daily national price for the history trend
        run: python scripts/append_history.py || echo "history snapshot failed (non-fatal)"
      - name: Re-add full station list (price-less registry stations, from committed cache)
        run: python scripts/fetch_lea_powerbi.py --merge-only || echo "merge failed (non-fatal)"
      - name: Geocode new stations (cached)
        run: python scripts/geocode.py || echo "geocode failed (non-fatal)"
      - name: Snap onto exact chain coords (uses last daily directory)
        run: python scripts/merge_chain_coords.py || echo "merge failed (non-fatal)"
      - name: Circle K live prices
        run: python scripts/fetch_circlek.py || echo "Circle K failed (non-fatal)"
      - name: Circle K business fixed price (today-stamped reference)
        run: python scripts/fetch_circlek_business.py || echo "Circle K business failed (non-fatal)"
      - name: Orlen wholesale reference
        run: python scripts/fetch_orlen_wholesale.py || echo "Orlen failed (non-fatal)"
      - name: Viada Wednesday promo prices (Super trečiadieniai)
        run: python scripts/fetch_viada_promos.py || echo "viada promos failed (non-fatal)"
      - name: Neste Nuolaidadienis (Wednesday discount)
        run: python scripts/fetch_neste_promo.py || echo "neste promo failed (non-fatal)"
      - name: Compare sources vs LEA -> discrepancies
        run: python scripts/compare.py || echo "compare failed (non-fatal)"
      - name: Brent oil price + weekly trend
        run: python scripts/fetch_oil.py || echo "oil failed (non-fatal)"
      - name: LT electricity market price
        run: python scripts/fetch_electricity.py || echo "electricity failed (non-fatal)"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stations.json data/geocode_cache.json data/sources/circlek.json data/sources/circlek_business.json data/sources/orlen_wholesale.json data/sources/viada_promos.json data/sources/viada_debug.json data/sources/neste_promo.json data/discrepancies.json data/oil.json data/electricity.json data/price_history.json || true
          # Stage every modified TRACKED file under data/ too — an updated tracked
          # output missing from the list above must not leave the tree dirty
          # (git rebase refuses on unstaged changes → publish dies 5/5 retries).
          git add -u data/ || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Publish with retries; on a data conflict prefer this run's fresh
            # regeneration (-X theirs). Fail loudly if it truly can't push.
            for i in 1 2 3 4 5; do
              if git fetch origin main && git rebase -X theirs origin/main && git push; then
                echo "published (attempt $i)"; exit 0
              fi
              echo "publish attempt $i failed — retrying"
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 8 + 3))
            done
            echo "::error::failed to publish updated data after 5 attempts"; exit 1
          fi

      # FINAL GATES. After everything is committed:
      # (1) network gate — compare our published date against the live LEA
      #     listing; if LEA has a newer file, FAIL (red X + email).
      # (2) local gate — every data source has a business-day freshness +
      #     integrity rule (Wednesday promos, daily scrapes, EV directory...);
      #     any silently-failing fetcher FAILS the run here even when its own
      #     step was '|| echo non-fatal'. A stale publish can NEVER end green.
      - name: Freshness gate (fail loudly if still behind LEA)
        run: python scripts/verify_freshness.py --check-only
      - name: Source staleness gate (fail loudly if any source rotted)
        run: python scripts/verify_sources.py
