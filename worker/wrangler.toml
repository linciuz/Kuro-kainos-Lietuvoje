name = "kk-reports"
main = "report-worker.js"
compatibility_date = "2024-11-01"

# Create the KV namespace once, then paste its id below:
#   npx wrangler kv namespace create REPORTS
# NOTE: this MUST stay above any [table] header — in TOML everything after a
# header like [triggers] belongs to that table, and a kv_namespaces nested
# under triggers is silently ignored (= Worker deploys with NO KV binding and
# every /count//reports route throws 1101).
kv_namespaces = [
  { binding = "REPORTS", id = "e2122714f84342ee9b5503a24047f3dd" }
]

# Native Workers rate limiter (free tier): caps write POSTs per IP as a real
# cross-request limit on top of the per-edge Cache API guard in the code.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Poke the price workflow (UTC = LT−3 in summer). MEASURED 2026-07: LEA's "10:00"
# is only the nominal reporting deadline — the actual public Excel appears much
# later, typically ~11:00–noon LT (07-15: still only yesterday's file at 10:30 LT).
# So the dense window covers 09:00–14:00 LT every 15 min to grab it the moment it
# drops, plus an early Orlen check and afternoon/night catch-alls.
# Window is 1h wide of the publish window on BOTH ends so the UTC+3 -> UTC+2
# winter shift needs no edit (extra pokes are free: no-change commit skip).
# Needs the GH_TOKEN secret:  npx wrangler secret put GH_TOKEN
[triggers]
crons = [
  # Split into two identical-timing entries (2026-07-25): Cloudflare cron
# DELIVERY died silently on 07-23 with the schedules still registered, and
# only a change to the schedule SET forces re-registration. Same firing
# times, no behaviour change — the split is the revival lever.
  "0 4 * * 1-5",
  "0 5 * * 1-5",         # 07:00, 08:00 LT (early — Orlen wholesale posts before LEA)
  "*/15 6-11 * * 1-5",     # every 15 min: 09:00–14:59 LT summer AND 08:00–13:59 LT winter — season-proof
  "0 12,22 * * 1-5",       # 15:00 LT + 01:00 LT (next day)
]
