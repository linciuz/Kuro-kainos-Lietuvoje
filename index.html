<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Oficialios degalų kainos Lietuvos degalinėse - pigiausių bei arčiausių paieška, žemėlapis ir kita.">
    <title>Fuelis · Kuro kainos Lietuvoje</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231673E8%22/><g transform=%22translate(0,-3.5)%22><path d=%22M50 12 C60 34 76 50 76 66 A26 26 0 1 1 24 66 C24 50 40 34 50 12 Z%22 fill=%22%23fff%22/><path d=%22M41 56 L50 51 L59 56%22 fill=%22none%22 stroke=%22%23F0453A%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><path d=%22M37 64 L50 71 L63 64%22 fill=%22none%22 stroke=%22%2320C778%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></g></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0057D8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fuelis">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 10px;
        }
        .app-container {
            max-width: 1200px; margin: 0 auto; background: white;
            border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        .controls { padding: 15px; background: white; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
        .action-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .act-btn {
            padding: 5px 9px; border: 1px solid #d0d0d0; border-radius: 8px; background: #fff;
            cursor: pointer; font-size: 13px; color: #333; line-height: 1;
        }
        .act-btn.on { background: #eef4ff; border-color: #007AFF; color: #0056b3; }
        .act-btn.donate { background: #fff2e0; border-color: #ffcf99; color: #a15b00; font-weight: 600; }
        .lang-switcher { position: relative; }
        .lang-current {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px;
            border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; color: #333;
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .lang-menu {
            position: absolute; right: 0; top: 110%; z-index: 1200; background: #fff;
            border: 1px solid #d0d0d0; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
            padding: 4px; min-width: 96px;
        }
        .lang-menu[hidden] { display: none; }
        .lang-menu button {
            display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 10px;
            border: none; background: none; border-radius: 7px; cursor: pointer;
            font-size: 13px; color: #333; text-align: left; font-weight: 600;
        }
        .lang-menu button:hover, .lang-menu button.active { background: #eef4ff; }
        .fuel-type-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .fuel-btn {
            padding: 12px 6px; border: 2px solid #007AFF; background: white; color: #007AFF;
            border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .fuel-btn.active { background: #007AFF; color: white; }
        .fuel-btn.ev { border-color: #1faa4b; color: #1faa4b; }
        .fuel-btn.ev.active { background: #1faa4b; color: white; }

        .view-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .view-btn {
            padding: 10px; border: 1px solid #ddd; background: #f8f9fa; color: #333;
            border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
        }
        .view-btn.active { background: #34323e; color: white; border-color: #34323e; }

        .locate-btn {
            width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 10px;
            background: #28a745; color: white; font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .locate-btn.on { background: #0056b3; }
        .locate-btn:disabled { opacity: .7; cursor: default; }

        .filter-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        select, .search-input {
            flex: 1; min-width: 140px; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 14px; background: white;
        }
        .sort-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .sort-label { font-size: 13px; font-weight: 600; color: #333; }
        .sort-btn {
            flex: 1; min-width: 90px; padding: 8px; border: 1px solid #ddd; background: #f8f9fa;
            border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .sort-btn.active { background: #007AFF; color: white; border-color: #007AFF; }
        .sort-btn:disabled { opacity: .45; cursor: default; }
        .radius-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
        .radius-btn {
            flex: 1; min-width: 52px; padding: 8px; border: 1px solid #ddd; background: #f8f9fa;
            border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .radius-btn.active { background: #28a745; color: white; border-color: #28a745; }

        .summary { background: #f8f9fa; margin: 0 15px 10px; padding: 12px; border-radius: 8px; }
        .summary-title { font-size: 12px; color: #666; margin-bottom: 8px; text-align: center; }
        .summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .stat-label { font-size: 11px; color: #666; }
        .stat-value { font-size: 18px; font-weight: bold; }
        .stat-value.lowest { color: #4CAF50; }
        .stat-value.highest { color: #dc3545; }
        .nat-table { width: 100%; border-collapse: collapse; }
        .nat-table th { font-size: 11px; color: #666; font-weight: 600; padding: 4px 6px; }
        .nat-table td { padding: 7px 6px; text-align: center; font-size: 15px; }
        .nat-table th:first-child, .nat-table td:first-child { text-align: left; font-weight: 600; color: #333; font-size: 13px; }
        .nat-table tbody tr { border-top: 1px solid #ececec; }
        .nat-table .lo { color: #1faa4b; font-weight: bold; }
        .nat-table .avg { color: #333; font-weight: bold; }
        .nat-table .hi { color: #dc3545; font-weight: bold; }
        .wholesale-ref {
            margin-top: 10px; padding-top: 8px; border-top: 1px dashed #d8d8d8;
            font-size: 11px; color: #777; text-align: center;
        }
        .wholesale-ref b { color: #555; }

        .stations-container { padding: 0 15px 15px; max-height: 60vh; overflow-y: auto; }
        .count-line { font-size: 12px; color: #888; margin: 6px 2px 10px; }
        .station-card {
            background: white; border: 1px solid #e0e0e0; border-radius: 12px;
            padding: 14px; margin-bottom: 10px;
        }
        .fav-btn {
            float: right; background: none; border: none; font-size: 22px; line-height: 1;
            cursor: pointer; color: #f5b301; padding: 0 0 4px 10px;
        }
        .best-price-badge, .worst-price-badge {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 3px 9px 3px 6px; border-radius: 6px; margin-bottom: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
        }
        .best-price-badge { background: #e7f7ee; color: #14914e; }   /* green: cheapest */
        .worst-price-badge { background: #fdeceb; color: #cf3b30; }  /* red: most expensive */
        .badge-arrow { width: 13px; height: 13px; display: block; flex: none; }
        .dist-badge {
            background: #eef4ff; color: #0056b3; padding: 3px 9px; border-radius: 6px;
            font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 6px; margin-left: 6px;
        }
        .station-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .station-name { font-size: 17px; font-weight: bold; color: #333; }
        .station-price { font-size: 22px; font-weight: bold; color: #007AFF; white-space: nowrap; }
        .no-price-badge { font-size: 12px; color: #8a8f98; font-weight: 600; white-space: nowrap; }
        .price-unit { font-size: 13px; color: #666; }
        .station-address { color: #666; font-size: 13px; margin: 6px 0 10px; }
        .station-muni { font-size: 12px; color: #888; margin-bottom: 10px; }
        .fuel-chips { display: flex; align-items: center; gap: 5px; margin: 0 0 10px; flex-wrap: wrap; }
        .fuel-chips .lbl { font-size: 11px; color: #888; }
        .fuel-chip {
            font-size: 14px; line-height: 1; padding: 3px 8px; border-radius: 8px;
            background: #eef4ff; border: 1px solid #d6e4ff;
        }
        .fuel-chip.off { background: #f4f4f4; border-color: #ececec; opacity: .4; filter: grayscale(1); }
        .approx-tag {
            font-size: 10px; color: #9a7b00; background: #fff6d6; border: 1px solid #f0e0a0;
            padding: 1px 6px; border-radius: 6px; margin-left: 4px;
        }
        .change-flag {
            font-size: 12px; color: #8a5a00; background: #fff4e0; border: 1px solid #ffd591;
            border-radius: 8px; padding: 6px 9px; margin-bottom: 10px;
        }
        .change-banner {
            background: #fff4e0; color: #8a5a00; border-bottom: 1px solid #ffd591;
            font-size: 12px; padding: 9px 15px; text-align: center;
        }
        #updated-line.stale { color: #b3261e; font-weight: 700; }
        .oil-footer {
            border-top: 1px solid #e0e0e0; font-size: 12px; color: #555;
            padding: 10px 15px; text-align: center; background: #fafbfc;
            display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
        }
        .oil-footer b { color: #333; }
        .oil-ind { font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .oil-footer.oil-ind-up .oil-ind { color: #b3261e; background: #fdecee; }
        .oil-footer.oil-ind-down .oil-ind { color: #1f7a3d; background: #e9f7ee; }
        .oil-footer.oil-ind-flat .oil-ind { color: #666; background: #eef0f2; }
        .report-line {
            font-size: 12px; color: #4a2f7a; background: #f0ebfb; border: 1px solid #d6c6f0;
            border-radius: 8px; padding: 6px 9px; margin-bottom: 10px;
        }
        .report-row { margin-top: 8px; }
        .report-btn {
            width: 100%; padding: 8px; border: 1px dashed #9b7fd4; background: #f7f3ff;
            color: #4a2f7a; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .nav-row { display: flex; gap: 8px; }
        .nav-btn {
            flex: 1; text-align: center; text-decoration: none; color: white; border: none;
            padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
        }
        .nav-gmaps { background: #1a73e8; color: #fff; }
        .nav-waze { background: #33ccff; color: #06283d; }
        /* Leaflet's .leaflet-container a link colour overrides .nav-btn inside map
           popups (higher specificity) — restore readable button text there. */
        .leaflet-popup-content a.nav-gmaps { color: #fff; }
        .leaflet-popup-content a.nav-waze { color: #06283d; }

        .msg { text-align: center; padding: 30px 15px; color: #666; font-size: 14px; }

        #map-view { padding: 0 15px 15px; }
        #map { width: 100%; height: 62vh; border-radius: 12px; border: 1px solid #e0e0e0; }
        .ev-pin {
            background: #14a3a3; color: #fff; font-size: 13px; line-height: 1;
            padding: 3px 4px; border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.4);
        }
        .ev-pin.ev-available { background: #1faa4b; }
        .ev-pin.ev-busy { background: #dc3545; }
        .ev-pin.ev-down { background: #6b7280; }
        .ev-pin.ev-unknown { background: #9aa0a6; }
        .ev-status {
            display: inline-block; margin-bottom: 6px; font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 6px; background: #f1f3f4;
        }
        .ev-status.ev-available { color: #1faa4b; background: #e9f7ee; }
        .ev-status.ev-busy { color: #dc3545; background: #fdecee; }
        .ev-status.ev-down, .ev-status.ev-unknown { color: #6b7280; }
        .price-pin {
            position: relative;
            background: #007AFF; color: #fff; font-weight: 700; font-size: 12px;
            padding: 3px 6px; border-radius: 8px; white-space: nowrap;
            border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); text-align: center;
        }
        .pin-fav { position: absolute; top: -9px; right: -7px; font-size: 13px; color: #f5b301;
            line-height: 1; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; }
        .price-pin.cheap { background: #1faa4b; }
        .price-pin.dear { background: #dc3545; }
        .price-pin.noprice { background: #9aa0a6; }
        .price-pin.approx { border-style: dashed; opacity: 0.8; }
        .price-pin.disc { box-shadow: 0 0 0 2px #1b9e5a, 0 1px 4px rgba(0,0,0,.4); }  /* discounted (loyalty) price */
        .user-dot {
            width: 18px; height: 18px; border-radius: 50%;
            background: #1a73e8; border: 3px solid #fff; box-sizing: border-box;
            box-shadow: 0 0 0 rgba(26,115,232,.5); animation: userpulse 1.8s ease-out infinite;
        }
        @keyframes userpulse {
            0%   { box-shadow: 0 0 0 0 rgba(26,115,232,.55); }
            70%  { box-shadow: 0 0 0 16px rgba(26,115,232,0); }
            100% { box-shadow: 0 0 0 0 rgba(26,115,232,0); }
        }
        .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
        .popup-name { font-weight: bold; font-size: 15px; color: #333; }
        .popup-addr { color: #666; font-size: 12px; margin: 2px 0 4px; }
        .popup-price { color: #007AFF; font-weight: bold; }
        .popup-nav { display: flex; gap: 6px; margin-top: 8px; }

        .footer a { color: #0056b3; }
        .footer p { margin: 2px 0; }
        .footer {
            background: #f8f9fa; padding: 14px; text-align: center;
            border-top: 1px solid #e0e0e0; font-size: 12px; color: #666;
        }
        /* --- Fuelis Tools (calculators + fuel log) modal --- */
        body.modal-open { overflow: hidden; }
        .tools-modal { position: fixed; inset: 0; z-index: 3000; display: none;
            background: rgba(20,28,40,0.45); align-items: flex-end; justify-content: center; }
        .tools-modal.open { display: flex; }
        .tools-sheet { background: #f5f6f8; width: 100%; max-width: 560px;
            max-height: 90vh; max-height: 90dvh;  /* dvh = visible viewport, so the sheet never hides behind the mobile URL bar */
            border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: 0 -6px 30px rgba(0,0,0,0.25); }
        @media (min-width: 600px) { .tools-modal { align-items: center; } .tools-sheet { border-radius: 16px; } }
        /* Sticky header keeps the ✕ reachable even if the sheet is tall / the URL bar is showing. */
        .tools-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
            border-bottom: 1px solid #e2e5ea; background: #fff; border-radius: 16px 16px 0 0; }
        .tools-close { flex: none; }
        #tools-title { font-size: 17px; font-weight: 650; color: #1b2430; }
        .tools-close { border: none; background: #eceef2; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; color: #444; }
        .tools-body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .tool-card { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 14px; }
        .tool-card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 650; color: #1b2430; }
        .tool-note { font-size: 12px; color: #6b7480; margin: -4px 0 10px; }
        .tool-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #55606d; margin-bottom: 9px; }
        .tool-card input, .tool-card select, .tool-card textarea { font-size: 16px; padding: 9px 11px; border: 1px solid #d3d7dd; border-radius: 8px; background: #fff; color: #1b2430; width: 100%; font-family: inherit; }
        .tool-card textarea { resize: vertical; min-height: 84px; }
        .tool-card input[type=file] { padding: 7px 9px; font-size: 13px; }
        .tool-card input:focus, .tool-card select:focus, .tool-card textarea:focus { outline: none; border-color: #007AFF; box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
        .tool-err { margin-top: 8px; color: #c2453a; font-weight: 600; font-size: 13px; }
        .act-btn.install { background: #eafaf0; border-color: #b6e6c8; color: #14914e; font-weight: 600; }
        /* iOS "Add to Home Screen" guide */
        .ios-intro { font-size: 14px; color: #2b3138; margin-bottom: 4px; }
        .ios-steps { list-style: none; margin: 6px 0 0; padding: 0; }
        .ios-step { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #eef1f4; font-size: 14px; color: #2b3138; line-height: 1.4; }
        .ios-step:last-child { border-bottom: none; }
        .ios-step .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #0057D8; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
        .ios-step .ios-share { flex: none; width: 24px; height: 24px; vertical-align: middle; }
        .ios-note { margin-top: 14px; font-size: 12.5px; color: #7a7f87; line-height: 1.45; }
        /* Side-opening info banner: the 10:00-snapshot caveat */
        .info-handle { position: fixed; left: 0; bottom: 88px; z-index: 2401; width: 42px; height: 46px; background: #ffcf66;
            border: none; border-radius: 0 12px 12px 0; box-shadow: 3px 4px 16px rgba(0,0,0,0.22); font-size: 19px;
            cursor: pointer; color: #6b4e00; line-height: 1; }   /* always-visible, always-clickable tab */
        .info-banner { position: fixed; left: 42px; bottom: 88px; z-index: 2400; max-width: min(300px, calc(100vw - 58px));
            transform: translateX(calc(-100% - 42px)); transition: transform .3s ease; }   /* slides in beside the tab */
        .info-banner.open { transform: translateX(0); }
        .info-content { background: #fff8e1; border: 1px solid #ffe0a3; border-radius: 0 12px 12px 0;
            padding: 11px 12px; box-shadow: 4px 5px 20px rgba(0,0,0,0.22); font-size: 12.5px; color: #7a5b00;
            line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; white-space: pre-line; }
        .info-x { flex: none; background: none; border: none; color: #b07818; font-size: 14px; line-height: 1; cursor: pointer; padding: 0 0 0 2px; }
        @media (prefers-reduced-motion: reduce) { .info-banner { transition: none; } }
        .tool-btn { margin-top: 4px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #007AFF; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tool-btn.save { background: #20b268; margin-top: 10px; }
        .tool-btn.ghost { background: #eef1f5; color: #1b2430; margin-top: 10px; }
        .tool-btn.small { width: auto; padding: 9px 14px; margin-top: 0; }
        .tool-out { margin-top: 12px; }
        .res-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eef0f3; font-size: 13.5px; color: #55606d; }
        .res-row:last-child { border-bottom: none; }
        .res-row b { color: #1b2430; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .res-row small { color: #8a929c; font-weight: 400; }
        .res-row.good b { color: #1b9e5a; }
        .res-row.big { padding-top: 10px; } .res-row.big b { font-size: 19px; }
        .res-row.bad b { color: #c2453a; }
        .verdict-line { margin-top: 8px; text-align: center; font-weight: 650; font-size: 15px; padding: 8px; border-radius: 8px; }
        .verdict-line.good { background: #e9f7ef; color: #1b9e5a; }
        .verdict-line.bad { background: #fbeeec; color: #c2453a; }
        .tool-hint { font-size: 13px; color: #8a929c; padding: 6px 0; }
        .tool-ok { margin-top: 8px; color: #1b9e5a; font-weight: 600; font-size: 13px; }
        /* --- Loyalty-card effective price --- */
        .loyalty-line { margin-top: 3px; font-size: 12px; font-weight: 600; color: #1b9e5a; white-space: nowrap; text-align: right; }
        .loyalty-line .loyalty-price { font-size: 15px; font-weight: 700; }
        .popup-loyalty { margin-top: 2px; font-size: 12px; font-weight: 600; color: #1b9e5a; }
        .tool-card .loyalty-switch { flex-direction: row; align-items: center; gap: 9px; font-size: 13.5px; color: #1b2430; margin-bottom: 12px; cursor: pointer; }
        .tool-card .loyalty-switch input { width: auto; margin: 0; }
        .loyalty-config.off { opacity: .45; }
        .loyalty-rows { display: flex; flex-direction: column; gap: 10px; }
        .loyalty-item { display: flex; flex-direction: column; gap: 2px; }
        .loyalty-preview { font-size: 11.5px; color: #55606d; padding-left: 1px; font-variant-numeric: tabular-nums; }
        .loyalty-preview:empty { display: none; }
        .loyalty-preview b { color: #1b9e5a; }
        .loyalty-row-note { font-size: 11.5px; color: #8a929c; padding-left: 1px; line-height: 1.35; }
        .loyalty-row { display: flex; align-items: center; gap: 8px; }
        .loyalty-net { flex: 1; min-width: 0; font-size: 13px; color: #55606d; }
        .tool-card .loyalty-row input { width: 84px; flex: none; text-align: right; margin: 0; }
        .loyalty-unit { width: 28px; font-size: 12px; color: #8a929c; }
        .loyalty-add { margin-top: 10px; width: 100%; font-size: 14px; padding: 9px 11px; border: 1px solid #d3d7dd; border-radius: 8px; background: #fff; color: #1b2430; }
        .loyalty-disclaimer { margin-top: 12px; margin-bottom: 0; }
        .log-add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .log-add-row input { flex: 1 1 70px; min-width: 0; font-size: 15px; padding: 8px; border: 1px solid #d3d7dd; border-radius: 7px; }
        .log-add-row input[type=date] { flex: 1 1 120px; }
        .log-summary { display: flex; gap: 8px; margin-bottom: 10px; }
        .log-summary > div { flex: 1; background: #f3f6fb; border-radius: 9px; padding: 8px; text-align: center; }
        .log-summary span { display: block; font-size: 11px; color: #6b7480; margin-bottom: 2px; }
        .log-summary b { font-size: 14px; color: #1b2430; font-variant-numeric: tabular-nums; }
        .log-row { padding: 8px 0; border-bottom: 1px solid #eef0f3; }
        .log-main { font-size: 13px; color: #1b2430; }
        .log-sub { font-size: 12px; color: #6b7480; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .log-del { margin-left: auto; border: none; background: #f3eded; color: #c2453a; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="change-banner" id="change-banner" style="display:none"></div>

        <div class="controls">
            <div class="topbar">
                <div class="action-bar" id="action-bar"></div>
                <div class="lang-switcher" id="lang-switcher"></div>
            </div>

            <div class="fuel-type-selector">
                <button class="fuel-btn active" id="btn-petrol95" onclick="selectFuel('petrol95')" data-i18n="btn_petrol95">⛽ Benzinas 95</button>
                <button class="fuel-btn" id="btn-diesel" onclick="selectFuel('diesel')" data-i18n="btn_diesel">🚛 Dyzelinas</button>
                <button class="fuel-btn" id="btn-lpg" onclick="selectFuel('lpg')" data-i18n="btn_lpg">🔥 Dujos</button>
                <button class="fuel-btn ev" id="btn-ev" onclick="selectFuel('ev')">⚡ EV</button>
            </div>

            <div class="view-toggle">
                <button class="view-btn active" id="view-list" onclick="setView('list')" data-i18n="view_list">📋 Sąrašas</button>
                <button class="view-btn" id="view-map" onclick="setView('map')" data-i18n="view_map">🗺️ Žemėlapis</button>
            </div>

            <button class="locate-btn" id="locate-btn" onclick="locate()">📍 Rasti artimiausias prie manęs</button>

            <div class="filter-row">
                <select id="muni-select" onchange="render()"><option value="">Visos savivaldybės</option></select>
                <input class="search-input" id="search" type="text" placeholder="Ieškoti (tinklas, adresas)…" data-i18n-ph="search_ph" oninput="onSearchInput()">
            </div>
            <div class="sort-row">
                <span class="sort-label" data-i18n="sort_label">Rūšiuoti:</span>
                <button class="sort-btn active" id="sort-asc" onclick="setSort('asc')" data-i18n="sort_cheap">💰 Pigiausios</button>
                <button class="sort-btn" id="sort-desc" onclick="setSort('desc')" data-i18n="sort_dear">Brangiausios</button>
                <button class="sort-btn" id="sort-dist" onclick="setSort('dist')" data-i18n="sort_near" disabled>📍 Arčiausios</button>
            </div>
            <div class="radius-row" id="radius-row" style="display:none">
                <span class="sort-label" data-i18n="radius_label">Atstumas:</span>
                <button class="radius-btn" data-km="2" onclick="setRadius(2)">2 km</button>
                <button class="radius-btn" data-km="5" onclick="setRadius(5)">5 km</button>
                <button class="radius-btn" data-km="10" onclick="setRadius(10)">10 km</button>
                <button class="radius-btn" data-km="25" onclick="setRadius(25)">25 km</button>
                <button class="radius-btn active" data-km="0" onclick="setRadius(0)">∞</button>
            </div>
        </div>

        <div id="list-view">
            <div class="stations-container" id="stations-list">
                <div class="msg">Kraunama…</div>
            </div>
        </div>

        <div id="map-view" style="display:none">
            <div id="map"></div>
        </div>

        <div class="summary" id="summary"></div>

        <div class="oil-footer" id="oil-footer" style="display:none"></div>

        <div class="footer">
            <p id="source-line">Kraunama oficialūs duomenys…</p>
            <p id="updated-line"></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script>
      // Translate the static controls now (i18n.js + app.js are already parsed),
      // before the first paint, so labels don't flash from the hardcoded default
      // to the active language (e.g. "Petrol 95" -> "Benzinas 95").
      try { applyStaticI18n(); } catch (e) {}
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("service-worker.js").catch(() => {}));
      }
    </script>
    <div id="tools-modal" class="tools-modal" onclick="if(event.target===this)closeTools()">
      <div class="tools-sheet">
        <div class="tools-head">
          <span id="tools-title">🧮</span>
          <button type="button" class="tools-close" onclick="closeTools()" aria-label="Close">✕</button>
        </div>
        <div class="tools-body" id="tools-body"></div>
      </div>
    </div>
    <div id="disc-modal" class="tools-modal" onclick="if(event.target===this)closeDiscounts()">
      <div class="tools-sheet">
        <div class="tools-head">
          <span id="disc-title">💳</span>
          <button type="button" class="tools-close" onclick="closeDiscounts()" aria-label="Close">✕</button>
        </div>
        <div class="tools-body" id="disc-body"></div>
      </div>
    </div>
    <div id="contact-modal" class="tools-modal" onclick="if(event.target===this)closeContact()">
      <div class="tools-sheet">
        <div class="tools-head">
          <span id="contact-title">✉️</span>
          <button type="button" class="tools-close" onclick="closeContact()" aria-label="Close">✕</button>
        </div>
        <div class="tools-body" id="contact-body"></div>
      </div>
    </div>
    <div id="ios-modal" class="tools-modal" onclick="if(event.target===this)closeIosInstall()">
      <div class="tools-sheet">
        <div class="tools-head">
          <span id="ios-title">📲</span>
          <button type="button" class="tools-close" onclick="closeIosInstall()" aria-label="Close">✕</button>
        </div>
        <div class="tools-body" id="ios-body"></div>
      </div>
    </div>
    <button id="info-handle" class="info-handle" onclick="toggleInfoBanner()" aria-label="Info">ℹ️</button>
    <aside id="info-banner" class="info-banner">
      <div class="info-content"><span id="info-banner-text"></span><button class="info-x" onclick="closeInfoBanner()" aria-label="Close">✕</button></div>
    </aside>
    <iframe name="ff_iframe" title="form target" style="display:none" aria-hidden="true"></iframe>
</body>
</html>
